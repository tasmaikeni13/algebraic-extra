[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algebraic-extra"
version = "0.1.0"
description = "Standalone 125M and 350M Algebraic Transformers with 32k tokenizer and pure XLA optimizers"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "tasmaikeni13"}]
dependencies = ["jax==0.6.2", "jaxlib==0.6.2", "numpy==2.2.6", "tokenizers==0.23.3"]

[project.urls]
Repository = "https://github.com/tasmaikeni13/algebraic-extra"

[project.scripts]
algebraic-train = "algebraic.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
